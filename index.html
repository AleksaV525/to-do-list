<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>To-do</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Cool graphite surfaces, one ultramarine accent, a single sans family. Quiet, precise, lots of air.
   Layout: sidebar on wide screens; on phones a floating tab capsule with a raised add button. */
:root {
  --bg: #ECEEF3; --bg2: #E4E7EE; --surface: #FFFFFF; --surface2: #FFFFFF; --sunk: #F3F5F9;
  --line: #E0E3EA; --line2: #CBD0DB;
  --ink: #0D1015; --muted: #636C7C;
  --hi: #3558F0; --hi-soft: rgba(53,88,240,.09); --accent: #3558F0; --accent-ink: #FFFFFF;
  --ok: #1E9E6A; --danger: #D92D3A;
  --p0: #8A93A5; --p1: #0E9F9F; --p2: #D98200; --p3: #E5384B;
  --c0: #3558F0; --c1: #0E9F9F; --c2: #8B5CF6; --c3: #DB4C8A; --c4: #D98200; --c5: #2FA35B;
  --glow: rgba(53,88,240,.11);
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 14px 34px -16px rgba(16,24,40,.18);
  --f-sans: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090B0F; --bg2: #0C0F14; --surface: #12161D; --surface2: #171C24; --sunk: #0D1015;
    --line: #212733; --line2: #2E3544;
    --ink: #EEF0F4; --muted: #8B94A5;
    --hi: #7C95FF; --hi-soft: rgba(124,149,255,.12); --accent: #4C69F5; --accent-ink: #FFFFFF;
    --ok: #4CC38A; --danger: #FF6B77;
    --p0: #8E97A8; --p1: #2CC4C4; --p2: #F5A524; --p3: #FF6B77;
    --c0: #7C95FF; --c1: #2CC4C4; --c2: #A78BFA; --c3: #F07AB0; --c4: #F5A524; --c5: #58C27D;
    --glow: rgba(76,105,245,.17);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 22px 44px -22px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090B0F; --bg2: #0C0F14; --surface: #12161D; --surface2: #171C24; --sunk: #0D1015;
  --line: #212733; --line2: #2E3544;
  --ink: #EEF0F4; --muted: #8B94A5;
  --hi: #7C95FF; --hi-soft: rgba(124,149,255,.12); --accent: #4C69F5; --accent-ink: #FFFFFF;
  --ok: #4CC38A; --danger: #FF6B77;
  --p0: #8E97A8; --p1: #2CC4C4; --p2: #F5A524; --p3: #FF6B77;
  --c0: #7C95FF; --c1: #2CC4C4; --c2: #A78BFA; --c3: #F07AB0; --c4: #F5A524; --c5: #58C27D;
  --glow: rgba(76,105,245,.17);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 22px 44px -22px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg);
  background-image: radial-gradient(1100px 560px at 92% -12%, var(--glow), transparent 62%), radial-gradient(800px 500px at -10% 108%, var(--hi-soft), transparent 60%);
  background-repeat: no-repeat; background-attachment: fixed;
  color: var(--ink);
  font: 400 15px/1.5 var(--f-sans);
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, h4, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ic { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }
#view { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.side { display: none; }
main {
  min-width: 0;
  padding-block: 14px 130px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 960px) {
  .shell { grid-template-columns: 252px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh; overflow: auto; padding: 26px 16px 20px; background: color-mix(in srgb, var(--bg2) 70%, transparent); border-right: 1px solid var(--line); }
  main { padding: 28px 48px 70px; }
}

/* sidebar */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 650; font-size: 17px; letter-spacing: -.02em; }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 550; text-align: left; min-height: 42px; }
.nav button:hover { color: var(--ink); background: var(--hi-soft); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); }
.nav button[aria-current="page"] .ic { color: var(--hi); }
.nav .n { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
.sec-h button { color: var(--muted); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; }
.sec-h button:hover { color: var(--hi); background: var(--hi-soft); }
.plist button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 12px; border-radius: 10px; color: var(--muted); font-weight: 500; text-align: left; min-height: 38px; }
.plist button:hover { color: var(--ink); background: var(--hi-soft); }
.plist button[aria-pressed="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.plist .n { margin-left: auto; font: 500 12px var(--f-mono); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--dc, var(--hi)); }
.side-foot { margin-top: auto; display: flex; gap: 8px; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.top .sp { flex: 1; }
@media (min-width: 960px) { .top .brand { display: none; } }
.ib { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.ib:hover { color: var(--hi); border-color: var(--line2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 13px; font-weight: 600; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px -10px var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line2); box-shadow: none; font-weight: 550; }
.btn.ghost:hover { border-color: var(--hi); color: var(--hi); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
.hide-m { display: none; }
@media (min-width: 700px) { .hide-m { display: inline-flex; } }

/* quick add */
.qa { display: flex; flex-direction: column; gap: 8px; }
.qa-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-height: 56px; }
.qa-row:focus-within { border-color: var(--hi); box-shadow: 0 0 0 4px var(--hi-soft); }
.qa-row .ic { color: var(--hi); }
.qa-row input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: 16px; height: 44px; }
.qa-row input::placeholder { color: var(--muted); }
.qa-prev { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 550 12px/1 var(--f-sans); color: var(--muted); padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); background: transparent; white-space: nowrap; max-width: 100%; }
.chip .ic { width: 12px; height: 12px; }
button.chip:hover { border-color: var(--hi); color: var(--ink); }
.chip.late { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.chip.tdy { color: var(--hi); border-color: color-mix(in srgb, var(--hi) 55%, transparent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.pp { color: var(--pc); border-color: color-mix(in srgb, var(--pc) 55%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { font-size: 13px; padding: 9px 14px; min-height: 38px; }
.scroll-x { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -2px; padding-inline: 2px; }
.scroll-x::-webkit-scrollbar { display: none; }
.scroll-x .chip { flex: none; }

/* cards & headings */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font: 600 19px/1.2 var(--f-sans); letter-spacing: -.02em; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; min-height: 32px; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.vh h1 { font: 600 clamp(32px, 6vw, 44px)/1 var(--f-sans); letter-spacing: -.035em; }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 16px; font-size: 14px; }

/* today hero */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 26px; background: linear-gradient(135deg, var(--surface), color-mix(in srgb, var(--hi) 7%, var(--surface))); }
.hero h1 { font: 600 clamp(40px, 8vw, 62px)/1 var(--f-sans); letter-spacing: -.04em; margin: 12px 0 10px; }
.hero p { color: var(--muted); max-width: 40ch; }
.ring { position: relative; width: 108px; height: 108px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .tr { stroke: var(--line); }
.ring .pg { stroke: url(#rg); stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring .tx { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .tx b { font: 600 26px/1 var(--f-sans); letter-spacing: -.03em; }
.ring .tx span { font: 500 10px var(--f-mono); color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.kpi b { display: block; font: 600 32px/1 var(--f-sans); letter-spacing: -.035em; margin-top: 10px; }
.kpi small { color: var(--muted); font-size: 12px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 16px; border: 1px dashed var(--hi); background: var(--hi-soft); font-size: 14px; }
.up-day { padding: 10px 0; border-top: 1px solid var(--line); }
.up-day:first-child { border-top: 0; padding-top: 0; }
.up-day h4 { margin: 0 0 6px; font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.up-i { display: flex; align-items: center; gap: 10px; padding: 5px 0; width: 100%; text-align: left; }
.up-i span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-i .pdot { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); flex: none; }
.pbar { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--c); border-radius: 5px; }
.prow { display: flex; flex-direction: column; gap: 7px; padding: 8px 0; text-align: left; width: 100%; }
.prow .l { display: flex; align-items: center; gap: 9px; justify-content: space-between; }

/* task list */
.tl { display: flex; flex-direction: column; gap: 22px; }
.gh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding: 0 4px; font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.gh.late { color: var(--danger); }
.gh span { opacity: .7; }
.tasks { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
.card .tasks { background: transparent; border: 0; border-radius: 0; box-shadow: none; margin-inline: -4px; }
.task { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: start; padding: 14px 16px; border-top: 1px solid var(--line); background: var(--surface); }
.card .task { background: transparent; padding-inline: 4px; }
.task:first-child { border-top: 0; }
.task.has-grip { grid-template-columns: auto auto minmax(0, 1fr); }
.task.drag { z-index: 5; box-shadow: var(--shadow); border-radius: 14px; border: 1px solid var(--hi); background: var(--surface2); }
.grip { display: grid; place-items: center; width: 22px; height: 28px; color: var(--muted); cursor: grab; touch-action: none; margin-left: -6px; }
.grip .ic { width: 16px; height: 16px; }
.ck { position: relative; width: 24px; height: 24px; border-radius: 8px; border: 1.8px solid var(--pc, var(--line2)); display: grid; place-items: center; color: transparent; margin-top: 1px; transition: background .15s, color .15s; flex: none; }
.ck::after { content: ""; position: absolute; inset: -11px; }
.ck .ic { width: 14px; height: 14px; stroke-width: 2.8; }
.ck:hover { background: var(--hi-soft); }
.task.done .ck, .ck.on { background: var(--pc, var(--hi)); color: #fff; }
.ck.sm { width: 18px; height: 18px; border-radius: 6px; margin-top: 2px; }
.ck.sm .ic { width: 11px; height: 11px; }
.tb { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.tt { font: 560 15px/1.35 var(--f-sans); text-align: left; overflow-wrap: anywhere; padding: 0; letter-spacing: -.005em; }
.tt:hover { color: var(--hi); }
.task.done .tt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line2); }
.desc { color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sublist { display: flex; flex-direction: column; gap: 7px; padding: 4px 0 2px; }
.sublist li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.sublist li.d span { color: var(--muted); text-decoration: line-through; }

/* tools */
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 46px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); }
.search:focus-within { border-color: var(--hi); box-shadow: 0 0 0 4px var(--hi-soft); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; height: 44px; color: var(--ink); }
.in { width: 100%; min-height: 46px; padding: 10px 13px; border-radius: 13px; border: 1px solid var(--line2); background: var(--sunk); color: var(--ink); }
.in:focus { outline: 0; border-color: var(--hi); box-shadow: 0 0 0 4px var(--hi-soft); }
select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea.in { resize: vertical; min-height: 84px; line-height: 1.45; }
.tools select.in { width: auto; flex: 1 1 150px; }
.fpanel { display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.fpanel .row { display: flex; flex-direction: column; gap: 8px; }
.lab { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 500 11px var(--f-mono); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line2); border-radius: 13px; background: var(--sunk); }
.seg button { padding: 7px 14px; border-radius: 10px; font-weight: 550; font-size: 13px; color: var(--muted); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 0 0 1px var(--line); }

/* planner */
.navrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.navrow h2 { flex: 1 1 200px; font: 600 20px/1.2 var(--f-sans); letter-spacing: -.02em; order: -1; }
.navrow .in { width: auto; min-height: 42px; flex: none; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.sd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 9px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); }
.sd .w { font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sd .d { font: 600 18px/1 var(--f-sans); letter-spacing: -.02em; }
.sd .c { height: 5px; display: flex; gap: 2px; }
.sd .c i { width: 5px; height: 5px; border-radius: 50%; background: var(--pc); }
.sd.today .d { color: var(--hi); }
.sd[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.sd[aria-pressed="true"] .w, .sd[aria-pressed="true"] .d { color: var(--accent-ink); }
.sd[aria-pressed="true"] .c i { background: var(--accent-ink); }
.tlcard { padding: 14px 14px 14px 10px; }
.tline { position: relative; }
.hr { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); }
.hr span { position: absolute; left: 0; top: -8px; width: 44px; text-align: right; font: 500 11px var(--f-mono); color: var(--muted); background: var(--surface); padding-right: 6px; }
.slots { position: absolute; left: 54px; right: 0; top: 0; bottom: 0; cursor: cell; }
.blk { position: absolute; display: flex; gap: 8px; align-items: flex-start; padding: 6px 28px 8px 8px; border-radius: 10px; background: color-mix(in srgb, var(--pc) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pc) 38%, transparent); border-left: 4px solid var(--pc); overflow: hidden; cursor: default; min-width: 0; }
.blk.v { background: transparent; border-style: dashed; border-left-style: solid; }
.blk.done { opacity: .55; }
.blk.done .bt b { text-decoration: line-through; }
.blk.act { z-index: 6; box-shadow: var(--shadow); }
.blk .ck { flex: none; margin-top: 1px; }
.bt { min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; flex: 1; }
.bt b { font: 600 13px/1.25 var(--f-sans); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bt span { font: 500 11px var(--f-mono); color: var(--muted); white-space: nowrap; }
.blk.sm { align-items: center; padding-top: 2px; padding-bottom: 2px; }
.blk.sm .bt { flex-direction: row; align-items: baseline; gap: 8px; }
.blk.sm .bt b { -webkit-line-clamp: 1; }
.bgrip { position: absolute; right: 0; top: 0; bottom: 14px; width: 28px; display: grid; place-items: center; color: var(--muted); cursor: grab; touch-action: none; }
.bgrip .ic { width: 14px; height: 14px; }

    else if (t.id === 'pdate') { if (t.value) { U.pd = t.value; U.scrollNow = true; render(); } }
    else if (t.id === 'e-due' || t.id === 'e-time') { if (t.id === 'e-time') { if (!t.value) E.dur = null; else if (!E.dur) E.dur = 30; } syncChips(); }
    else if (t.id === 'e-rec' || t.id === 'e-u') { if (t.id === 'e-rec' && E) { E.rec = t.value ? { t: t.value, n: 1, u: t.value === 'weekly' ? 'week' : t.value === 'monthly' ? 'month' : 'day', days: (E.rec && E.rec.days) || [] } : null; } syncRec(); }
    else if (t.id === 's-file') {
      var f = t.files && t.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects) || !Array.isArray(d.log)) throw 0;
          takeSnap(); S = d; S.settings = Object.assign({ theme: 'auto', notif: false }, S.settings || {}); save(); applyTheme(); closeModal(); render(); toast('Kopija je vraćena', 'Poništi', function () { undo(); });
        } catch (x) { toast('Taj fajl nije ispravna kopija'); }
      };
      rd.readAsText(f);
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { U.q = t.value; renderList(); }
    else if (t.id === 'qaIn') qaPrev();
    else if (t.id === 'e-due' || t.id === 'e-time') { if (E) { if (t.id === 'e-time') { if (!t.value) E.dur = null; else if (!E.dur) E.dur = 30; } syncChips(); } }
    else if (t.dataset && t.dataset.m === 'subtx' && E) { E.subs[+t.dataset.i].t = t.value; }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Escape' && $('#modal').firstChild) { closeModal(); return; }
    if (t.id === 'e-tag' && (e.key === 'Enter' || e.key === ',')) {
      e.preventDefault(); var g = t.value.trim().replace(/^#/, '').replace(/,$/, ''); if (g && E.tags.indexOf(g) < 0) { E.tags.push(g); renderTags(); $('#e-tag').focus(); }
    } else if (t.id === 'e-tag' && e.key === 'Backspace' && !t.value && E.tags.length) { E.tags.pop(); renderTags(); $('#e-tag').focus(); }
    else if (t.id === 'e-subnew' && e.key === 'Enter') {
      e.preventDefault(); var s = t.value.trim(); if (s) { E.subs.push({ id: uid(), t: s, done: false }); renderSubs(); $('#e-subnew').focus(); }
    } else if (E && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); }
    else if (E && t.id === 'e-title' && e.key === 'Enter') { e.preventDefault(); saveEditor(); }
    else if (t.dataset && t.dataset.m === 'subtx' && e.key === 'Enter') { e.preventDefault(); $('#e-subnew').focus(); }
    else if (!E && !$('#modal').firstChild && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === 'n') { e.preventDefault(); openEditor(null, newPref()); }
      else if (e.key === 'q') { e.preventDefault(); $('#qaIn').focus(); }
      else if (e.key === '/') { e.preventDefault(); if (U.view !== 'tasks') setView('tasks'); var s2 = $('#q'); if (s2) s2.focus(); }
    }
  });

  /* quick add */
  function qaPrev() { var v = $('#qaIn').value; $('#qaPrev').innerHTML = prevChips(parseQuick(v), v); }
  $('#qa').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#qaIn'), v = inp.value.trim(); if (!v) { inp.focus(); return; }
    var t = fromParsed(parseQuick(v)); t.order = minOrder() - 1; S.tasks.push(t);
    inp.value = ''; qaPrev(); save(); render();
    toast('Dodato: ' + t.title + (t.due ? ' · ' + dueText(t).toLowerCase() : ''));
  });
  $('#qaMore').addEventListener('click', function () {
    var v = $('#qaIn').value.trim(), pref = v ? fromParsed(parseQuick(v)) : null;
    $('#qaIn').value = ''; qaPrev();
    openEditor(null, pref ? { title: pref.title, due: pref.due, time: pref.time, dur: pref.dur, prio: pref.prio, tags: pref.tags, rec: pref.rec, proj: pref.proj } : newPref());
  });

  /* ================= drag & drop ================= */
  var drag = null, bdrag = null;
  document.addEventListener('pointerdown', function (e) {
    var bg = e.target.closest('[data-bg]');
    if (bg) {
      var blk = bg.closest('.blk'), t = taskOf(bg.dataset.id), tl = bg.closest('.tline'); if (!blk || !t || !tl) return;
      e.preventDefault();
      bdrag = { blk: blk, t: t, kind: bg.dataset.bg, y0: e.clientY, s0: mins(t.time), d0: t.dur || DEF_DUR, start: +tl.dataset.start, id: e.pointerId, s: mins(t.time), d: t.dur || DEF_DUR, moved: false };
      blk.classList.add('act');
      try { bg.setPointerCapture(e.pointerId); } catch (x) {}
      return;
    }
    var g = e.target.closest('[data-grip]'); if (!g) return;
    var li = g.closest('.task'), ul = li && li.parentNode; if (!ul) return;
    e.preventDefault();
    var r = li.getBoundingClientRect();
    drag = { li: li, ul: ul, off: e.clientY - r.top, id: e.pointerId, h: r.height };
    li.classList.add('drag');
    try { g.setPointerCapture(e.pointerId); } catch (x) {}
  });
  document.addEventListener('pointermove', function (e) {
    if (bdrag && e.pointerId === bdrag.id) {
      var dm = Math.round((e.clientY - bdrag.y0) / HH * 60 / 15) * 15, b = bdrag; b.moved = b.moved || Math.abs(e.clientY - b.y0) > 3;
      if (b.kind === 'move') { b.s = Math.max(b.start * 60, Math.min(23 * 60 + 45 - b.d0 + 15, b.s0 + dm)); b.blk.style.top = ((b.s - b.start * 60) * HH / 60) + 'px'; }
      else { b.d = Math.max(15, Math.min(600, b.d0 + dm)); b.blk.style.height = Math.max(b.d * HH / 60, 28) + 'px'; }
      var sp = $('.bt span', b.blk); if (sp) sp.textContent = hhmm(b.s) + '–' + hhmm(b.s + b.d);
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    var li = drag.li;
    li.style.transform = ''; var nat = li.getBoundingClientRect().top;
    li.style.transform = 'translateY(' + (e.clientY - drag.off - nat) + 'px)';
    var c = e.clientY - drag.off + drag.h / 2, prev = li.previousElementSibling, next = li.nextElementSibling;
    if (prev) { var pr = prev.getBoundingClientRect(); if (c < pr.top + pr.height / 2) { drag.ul.insertBefore(li, prev); } }
    if (next) { var nr = next.getBoundingClientRect(); if (c > nr.top + nr.height / 2) { drag.ul.insertBefore(next, li); } }
    li.style.transform = ''; nat = li.getBoundingClientRect().top; li.style.transform = 'translateY(' + (e.clientY - drag.off - nat) + 'px)';
    if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  });
  function endDrag(e) {
    if (bdrag && (!e || e.pointerId === bdrag.id)) {
      var b = bdrag; bdrag = null;
      if (b.moved && (b.s !== b.s0 || b.d !== b.d0)) { takeSnap(); b.t.time = hhmm(b.s); b.t.dur = b.d; b.t.fired = ''; save(); toast('Termin: ' + hhmm(b.s) + '–' + hhmm(b.s + b.d), 'Poništi', undo); }
      render(); return;
    }
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var li = drag.li; li.classList.remove('drag'); li.style.transform = '';
    var ids = $$('.task', drag.ul).map(function (x) { return x.dataset.id; });
    drag = null; reorder(ids); render();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  /* ================= boot ================= */
  load(); applyTheme(); render(); qaPrev();
  setInterval(tick, 30000); setTimeout(checkReminders, 800);
  if (/[?&]new=1/.test(location.search)) openEditor(null, {});
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
</body>
